name: Deploy MindGuard Backend

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: MindGuard_Guardian_NORMAL_CHAT_FINAL/mg_extracted/mindguard-backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Diagnostics
        working-directory: MindGuard_Guardian_NORMAL_CHAT_FINAL/mg_extracted/mindguard-backend
        run: python -c "import app; print('App loaded successfully!')"
