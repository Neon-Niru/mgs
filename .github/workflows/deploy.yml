name: Deploy MindGuard

on:
  push:
    branches: [ main ]

# Allow workflow to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: MindGuard_Guardian_NORMAL_CHAT_FINAL/mg_extracted/mindguard-backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact (Frontend)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'MindGuard_Guardian_NORMAL_CHAT_FINAL/mg_extracted/mindguard-frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
