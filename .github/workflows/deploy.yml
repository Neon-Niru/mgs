name: Deploy MindGuard Backend

on:
  push:
    branches: [ main ]  # Triggers on pushes to the main branch

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'  # Match your project's Python version
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; endif

    - name: Run Tests / Code Check
      run: |
        # Add your test command here if you have tests (e.g., pytest)
        echo "Build and dependency check passed successfully!"
