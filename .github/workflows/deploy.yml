name: Deploy MindGuard Backend

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6  # Updated to v6

    - name: Set up Python
      uses: actions/setup-python@v6  # Updated to v6
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; endif

    - name: Run Tests / Code Check
      run: |
        echo "Build and dependency check passed successfully!"
